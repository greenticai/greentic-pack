[workspace]
members = [
    "crates/greentic-pack",
    "crates/packc",
    "crates/pack_component",
    "crates/pack_component_template",
]
exclude = [
    "examples/weather-demo/.packc/pack_component",
    "examples/qa-demo/.packc/pack_component",
    "crates/packc/tests/router_echo",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
version = "1.3.0-research.13"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde_json = "1"
serde_cbor = "0.11"
sha2 = "0.11"
hex = "0.4"
blake3 = "1"
constant_time_eq = "0.5"
ciborium = "0.2"
walkdir = "2"
thiserror = "2"
base64 = "0.22"
ignore = "0.4"
toml = "1"
tracing = "0.1"
greentic-config-types = ">=1.3.0-research.1, <1.4.0-0"
greentic-qa-lib = ">=1.3.0-research.1, <1.4.0-0"
greentic-i18n-lib = ">=1.2.0-dev, <1.3.0-0"
greentic-config = ">=1.3.0-research.1, <1.4.0-0"
tempfile = "3"
rand_core = "0.10"
getrandom = "0.4"
rustls-pki-types = "1"
x509-parser = "0.18"
regex = "1"
hyper = "1"
wit-component = "0.247"
schemars = "1"
wasmtime = "45"
wasmtime-wasi = "45"
wasmtime-wasi-http = { version = "45", default-features = false, features = ["p2"] }
assert_cmd = "2"
indoc = "2"
predicates = "3"
indexmap = "2"
sys-locale = "0.3"
unic-langid = "0.9"
criterion = "0.8"

[workspace.dependencies.clap]
version = "4"
features = [
    "derive",
]

[workspace.dependencies.serde]
version = "1"
features = [
    "derive",
]

[workspace.dependencies.serde_yaml_bw]
package = "serde_yaml_gtc"
version = "2"

[workspace.dependencies.semver]
version = "1"
features = [
    "serde",
]

[workspace.dependencies.zip]
version = "8"
default-features = false
features = [
    "deflate",
]

[workspace.dependencies.time]
version = "0.3"
features = [
    "macros",
    "serde",
    "formatting",
    "parsing",
]

[workspace.dependencies.ed25519-dalek]
version = "2"
features = [
    "pkcs8",
    "rand_core",
]

[workspace.dependencies.pkcs8]
version = "0.10"
features = [
    "pem",
]

[workspace.dependencies.tracing-subscriber]
version = "0.3"
default-features = false
features = [
    "registry",
    "std",
]

[workspace.dependencies.greentic-types]
version = ">=1.3.0-research.1, <1.4.0-0"

[workspace.dependencies.greentic-flow]
version = ">=1.3.0-research.5, <1.4.0-0"

[workspace.dependencies.greentic-interfaces-host]
version = ">=1.3.0-research.1, <1.4.0-0"

[workspace.dependencies.greentic-interfaces-wasmtime]
version = ">=1.3.0-research.1, <1.4.0-0"

[workspace.dependencies.greentic-telemetry]
version = ">=1.1.0, <1.3.0-0"
features = [
    "otlp",
]

[workspace.dependencies.greentic-pack]
package = "greentic-pack-lib"
path = "crates/greentic-pack"
version = ">=1.3.0-research.13, <1.4.0-0"

[workspace.dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt",
    "rt-multi-thread",
]

[workspace.dependencies.pack_component_template]
version = ">=1.3.0-research.13, <1.4.0-0"
path = "crates/pack_component_template"

[workspace.dependencies.rcgen]
version = "0.14"
default-features = false
features = [
    "pem",
    "ring",
]

[workspace.dependencies.reqwest]
version = "0.13"
default-features = false
features = [
    "blocking",
    "rustls",
]

[workspace.dependencies.greentic-distributor-client]
version = ">=1.3.0-research.4, <1.4.0-0"
default-features = false
features = [
    "reqwest",
    "dist-client",
]

[workspace.dependencies.wit-bindgen]
version = "0.54"
default-features = false
features = [
    "macros",
    "realloc",
]

# Research-line chain (greentic-start#595). crates.io publishing is locked
# fleet-wide, so the research-line builds this workspace needs exist only in
# git: greentic-flow 1.3.0-research.5 (cut from flow's develop), and the
# greentic-distributor-client 1.3.0-research.4 / greentic-secrets
# 1.3.0-research.3 it is built against. A patch section does not travel into a
# published crate; every consumer carries the same patch at its own root.
# TO UNWIND once publishing is restored: delete this block, `cargo update`.
[patch.crates-io]
greentic-flow = { git = "https://github.com/greenticai/greentic-flow", rev = "348cceb857034ad6533905d747328dca13c1b610" }
greentic-distributor-client = { git = "https://github.com/greenticai/greentic-distributor-client", rev = "d594bb896c9722f439bf3c0cb98a3b85afb9b540" }
greentic-secrets-lib = { git = "https://github.com/greenticai/greentic-secrets", rev = "633934c31a4d0413885bbced87acbc29a03c7b28" }
