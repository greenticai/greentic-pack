name: CI & Publish
on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: greenticai/.github/.github/workflows/host-crate-ci.yml@main
    with:
      run-semver-checks: false
      setup-script: |
        bash ci/check_no_duplicate_canonical_wit.sh
        if [ "$(uname -s)" = "Linux" ]; then
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
        fi
        sudo apt-get update && sudo apt-get install -y lld clang
        mkdir -p .cargo
        cat > .cargo/config.toml <<'TOML'
        [target.x86_64-unknown-linux-gnu]
        linker = "clang"
        rustflags = ["-C", "link-arg=-fuse-ld=lld"]
        TOML
        rustup target add wasm32-wasip2
        if [ ! -x "$HOME/.cargo/bin/cargo-binstall" ]; then
          cargo install cargo-binstall --locked
        fi
        BINSTALL_DISABLE_STRATEGIES=compile cargo binstall cargo-component -y --force || cargo install cargo-component --locked --force
        BINSTALL_DISABLE_STRATEGIES=compile cargo binstall greentic-component -y --force || cargo install greentic-component --locked --force
        BINSTALL_DISABLE_STRATEGIES=compile cargo binstall wasm-tools -y --force
      test-args: "--workspace --all-features --locked"

  semver-checks:
    name: Semver Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: semver-${{ runner.os }}-rust-1.94-${{ hashFiles('**/Cargo.lock') }}
      - name: Setup semver environment
        run: |
          bash ci/check_no_duplicate_canonical_wit.sh
          if [ "$(uname -s)" = "Linux" ]; then
            df -h
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
            df -h
          fi
          sudo apt-get update && sudo apt-get install -y lld clang
          mkdir -p .cargo
          cat > .cargo/config.toml <<'TOML'
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          TOML
          rustup target add wasm32-wasip2
          if [ ! -x "$HOME/.cargo/bin/cargo-binstall" ]; then
            cargo install cargo-binstall --locked
          fi
          BINSTALL_DISABLE_STRATEGIES=compile cargo binstall cargo-component -y --force || cargo install cargo-component --locked --force
          BINSTALL_DISABLE_STRATEGIES=compile cargo binstall greentic-component -y --force || cargo install greentic-component --locked --force
          BINSTALL_DISABLE_STRATEGIES=compile cargo binstall wasm-tools -y --force
      - name: Resolve semver baseline tag
        id: semver-baseline
        run: |
          git fetch --tags --force
          baseline_tag="$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')"
          if [ -z "$baseline_tag" ]; then
            echo "Unable to determine previous stable v* tag for semver baseline" >&2
            exit 1
          fi
          echo "baseline_tag=$baseline_tag" >> "$GITHUB_OUTPUT"
          echo "Using semver baseline tag: $baseline_tag"
      - name: Run semver checks against previous git tag
        run: |
          rustup override set 1.94.0
          rustc --version
          cargo --version
          cargo install cargo-semver-checks --locked --force
          cargo semver-checks check-release \
            --baseline-rev "${{ steps.semver-baseline.outputs.baseline_tag }}" \
            --package greentic-pack \
            --package greentic-pack-lib \
            --package pack_component_template

  release:
    name: Build binaries + Release
    needs: [ci, semver-checks]
    if: >-
      needs.ci.result == 'success' && needs.semver-checks.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - name: Install target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}-${{ matrix.target }}-rust-1.91-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Linux toolchains
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld clang gcc-aarch64-linux-gnu
      - name: Configure lld for native Linux x86_64 builds
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=lld"]
          EOF
      - name: Configure linker for Linux aarch64 builds
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - name: Derive release tag and title from workspace version
        run: |
          set -euo pipefail
          version=$(perl -ne 'print $1 if /^version\s*=\s*"([^"]+)"/' Cargo.toml | head -n 1)
          tag="v${version}"
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=${tag}" >> "$GITHUB_ENV"
      - name: Build binstall artifacts
        run: |
          set -euo pipefail
          cargo build --release --target ${{ matrix.target }} --package greentic-pack --bin greentic-pack
          out_dir="target/${{ matrix.target }}/release"
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows-msvc" ]]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path '${out_dir}/greentic-pack.exe' -DestinationPath 'dist/greentic-pack-${{ matrix.target }}.zip' -Force"
          else
            tar -czf "dist/greentic-pack-${{ matrix.target }}.tgz" -C "${out_dir}" greentic-pack
          fi
      - name: Upload binstall artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/greentic-pack-${{ matrix.target }}.*
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
